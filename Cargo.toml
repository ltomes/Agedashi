[package]
name = "agedashi"
version = "0.1.0"
edition = "2021"
authors = ["ltomes"]
description = "A Rust CLI tool that transforms Terraform/OpenTofu graph output into beautiful infrastructure diagrams"
license = "MIT"
repository = "https://github.com/ltomes/Agedashi"
readme = "README.md"
keywords = ["terraform", "opentofu", "infrastructure", "diagrams", "visualization"]
categories = ["command-line-utilities", "visualization"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "icons/**/*",
    "build.rs",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
regex = "1.10"
tempfile = "3.8"
ureq = { version = "2.9", features = ["tls"] }
zip = "0.6"
sevenz-rust = "0.6"
resvg = "0.43"
usvg = "0.43"
tiny-skia = "0.11"
base64 = "0.22"
