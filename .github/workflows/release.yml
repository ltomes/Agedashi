name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Determine version bump
        id: version
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s")
          fi

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -q "^feat!:\|^fix!:\|^BREAKING CHANGE:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -q "^feat:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -q "^fix:"; then
            BUMP="patch"
          fi

          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep "^version" Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')

          # Calculate next version
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]%%[-+]*}  # Remove any prerelease suffix

          if [ "$BUMP" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"

          # Add prerelease suffix for develop branch
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            # Count commits on develop to get unique prerelease number
            COMMIT_COUNT=$(git rev-list --count HEAD)
            NEXT_VERSION="$NEXT_VERSION-beta.$COMMIT_COUNT"
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION"

      - name: Update Cargo.toml version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build release binary
        run: cargo build --release

      - name: Generate sample diagrams
        run: |
          mkdir -p release-samples
          # Generate TB (top-to-bottom) diagrams
          cat test/sample-graph.dot | ./target/release/agedashi --output png --name release-samples/sample-infrastructure-tb --direction TB
          cat test/sample-graph.dot | ./target/release/agedashi --output svg --name release-samples/sample-infrastructure-tb --direction TB
          cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name release-samples/sample-infrastructure-tb --direction TB
          # Generate LR (left-to-right) diagrams
          cat test/sample-graph.dot | ./target/release/agedashi --output png --name release-samples/sample-infrastructure-lr --direction LR
          cat test/sample-graph.dot | ./target/release/agedashi --output svg --name release-samples/sample-infrastructure-lr --direction LR
          cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name release-samples/sample-infrastructure-lr --direction LR

      - name: Create release archives
        run: |
          # Create binary archive
          mkdir -p release
          cp target/release/agedashi release/
          cp README.md LICENSE release/ 2>/dev/null || true
          cd release
          tar -czf agedashi-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz *
          cd ..
          mv release/agedashi-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz .

          # Create samples archive
          cd release-samples
          tar -czf agedashi-samples-${{ steps.version.outputs.version }}.tar.gz *
          cd ..
          mv release-samples/agedashi-samples-${{ steps.version.outputs.version }}.tar.gz .

      - name: Commit version bump
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create Git tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Generate changelog
        id: changelog
        run: |
          # Try to get the previous tag (before the one we just created)
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log HEAD~1 --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $LAST_TAG..HEAD~1 --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save changelog to file to preserve newlines
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ github.ref == 'refs/heads/develop' && format('v{0} (Beta)', steps.version.outputs.version) || format('v{0}', steps.version.outputs.version) }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: |
            agedashi-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            agedashi-samples-${{ steps.version.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ steps.version.outputs.is_prerelease == 'true' && 'Prerelease (Beta)' || 'Full Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump:** ${{ steps.version.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release →](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
