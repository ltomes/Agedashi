name: CI

on:
  push:
    branches:
      - "develop"
      - "main"
      - "claude/**"
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check formatting and linting
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build and test matrix across platforms and Rust versions
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          # Test MSRV (Minimum Supported Rust Version) on Linux only
          # Edition 2024 support requires Rust 1.85.0+
          - os: ubuntu-latest
            rust: 1.85.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ matrix.rust }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust installation
        run: |
          source $HOME/.cargo/env
          echo "Rust toolchain: ${{ matrix.rust }}"
          rustc --version
          cargo --version

      - name: Install GraphViz (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install GraphViz (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install graphviz

      - name: Install GraphViz (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install graphviz -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Graphviz\bin"
        shell: pwsh

      - name: Verify GraphViz installation (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Verify GraphViz installation
          if (Test-Path "C:\Program Files\Graphviz\bin\dot.exe") {
            Write-Host "✓ GraphViz found at standard location"
          } else {
            Write-Host "✗ GraphViz not found at C:\Program Files\Graphviz\bin"
            Get-ChildItem "C:\Program Files" -Filter "Graphviz*" -Directory -ErrorAction SilentlyContinue
          }
          # Check PATH
          Write-Host "Current PATH includes:"
          $env:PATH -split ';' | Where-Object { $_ -like '*graphviz*' }
          # Try to run dot
          & "C:\Program Files\Graphviz\bin\dot.exe" -V
        shell: pwsh

      - name: Verify GraphViz installation (Unix)
        if: matrix.os != 'windows-latest'
        run: dot -V

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-registry-
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run all tests
        run: cargo test --verbose
        env:
          # Ensure GraphViz is in PATH for Windows (for subprocess spawning in tests)
          PATH: ${{ matrix.os == 'windows-latest' && format('{0};C:\Program Files\Graphviz\bin', env.PATH) || env.PATH }}

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Upload binary artifact
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: agedashi-${{ matrix.os }}
          path: |
            target/release/agedashi
          retention-days: 7

  # Test all output formats work correctly
  test-output-formats:
    name: Test Output Formats
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        format: [png, svg, pdf, jpg]
        direction: [TB, LR]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Test ${{ matrix.format }} format with ${{ matrix.direction }} direction
        run: |
          cat test/sample-graph.dot | ./target/release/agedashi \
            --output ${{ matrix.format }} \
            --direction ${{ matrix.direction }} \
            --name test-${{ matrix.format }}-${{ matrix.direction }}

      - name: Verify output file exists
        run: |
          FILE="test-${{ matrix.format }}-${{ matrix.direction }}.${{ matrix.format }}"
          if [ ! -f "$FILE" ]; then
            echo "Error: Output file $FILE was not created"
            exit 1
          fi
          echo "✓ Output file created: $FILE ($(stat -c%s "$FILE") bytes)"

      - name: Upload generated diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-${{ matrix.format }}-${{ matrix.direction }}
          path: test-${{ matrix.format }}-${{ matrix.direction }}.${{ matrix.format }}
          retention-days: 7

  # Test all AWS resource types
  test-aws-resources:
    name: Test AWS Resource Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Test all AWS resources
        run: |
          if [ -f test/all-aws-resources.dot ]; then
            cat test/all-aws-resources.dot | ./target/release/agedashi \
              --output png \
              --name test-all-resources
            echo "✓ Successfully processed all AWS resource types"
          else
            echo "⚠ test/all-aws-resources.dot not found, skipping"
          fi

      - name: Test complex modules
        run: |
          if [ -f test/complex-modules-test.dot ]; then
            cat test/complex-modules-test.dot | ./target/release/agedashi \
              --output svg \
              --name test-complex-modules
            echo "✓ Successfully processed complex module structure"
          else
            echo "⚠ test/complex-modules-test.dot not found, skipping"
          fi

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache cargo-tarpaulin
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin-0.30.0

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.30.0 --locked

      - name: Generate coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml --bins --tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./cobertura.xml

      - name: Generate coverage report
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out html --bins --tests

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html
          retention-days: 30

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        run: |
          cargo install cargo-audit
          cargo audit

  # Benchmarks (only on stable Linux)
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            target
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --no-fail-fast | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-output.txt
          retention-days: 30

  # Test documentation builds
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --document-private-items --all-features

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc
          retention-days: 30

  # Summary job that reports on all test results
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test, test-output-formats, test-aws-resources, coverage, security]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All CI checks completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Matrix | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Output Formats | ${{ needs.test-output-formats.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Resources | ${{ needs.test-aws-resources.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required job failed
        if: |
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.test-output-formats.result != 'success'
        run: exit 1
