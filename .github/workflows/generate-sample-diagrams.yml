name: Generate Sample Diagrams

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install GraphViz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build agedashi
      run: cargo build --release

    - name: Create samples directory
      run: mkdir -p samples

    - name: Generate TB (top-to-bottom) diagrams
      run: |
        cat test/sample-graph.dot | ./target/release/agedashi --output png --name samples/sample-infrastructure-tb --direction TB
        cat test/sample-graph.dot | ./target/release/agedashi --output svg --name samples/sample-infrastructure-tb --direction TB
        cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name samples/sample-infrastructure-tb --direction TB

    - name: Generate LR (left-to-right) diagrams
      run: |
        cat test/sample-graph.dot | ./target/release/agedashi --output png --name samples/sample-infrastructure-lr --direction LR
        cat test/sample-graph.dot | ./target/release/agedashi --output svg --name samples/sample-infrastructure-lr --direction LR
        cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name samples/sample-infrastructure-lr --direction LR

    - name: List generated files
      run: ls -lh samples/

    - name: Upload diagrams as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sample-diagrams
        path: |
          samples/*.png
          samples/*.svg
          samples/*.pdf
        retention-days: 90

    - name: Add diagrams to workflow summary
      run: |
        REPO="${{ github.repository }}"
        BRANCH="${{ github.ref_name }}"
        RUN_ID="${{ github.run_id }}"
        EVENT_NAME="${{ github.event_name }}"

        echo "## Generated Diagrams" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$EVENT_NAME" = "pull_request" ]; then
          # For PRs, link to artifacts since diagrams aren't committed
          echo "Sample diagrams have been generated and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**[⬇️ Download sample-diagrams.zip](https://github.com/${REPO}/actions/runs/${RUN_ID}#artifacts)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The artifact contains:" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-tb.png\` - Top-to-Bottom layout" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-lr.png\` - Left-to-Right layout" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-tb.svg\` - Vector format (TB)" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-lr.svg\` - Vector format (LR)" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-tb.pdf\` - Print format (TB)" >> $GITHUB_STEP_SUMMARY
          echo "- \`sample-infrastructure-lr.pdf\` - Print format (LR)" >> $GITHUB_STEP_SUMMARY
        else
          # For develop/main, show images directly since they're committed
          echo "### Top-to-Bottom Layout" >> $GITHUB_STEP_SUMMARY
          echo "![TB Diagram](https://raw.githubusercontent.com/${REPO}/${BRANCH}/samples/sample-infrastructure-tb.png)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Left-to-Right Layout" >> $GITHUB_STEP_SUMMARY
          echo "![LR Diagram](https://raw.githubusercontent.com/${REPO}/${BRANCH}/samples/sample-infrastructure-lr.png)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View all samples in repository →](https://github.com/${REPO}/tree/${BRANCH}/samples)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Post diagrams to PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          try {
            // Get artifact information and create download links
            const runId = context.runId;
            const repo = context.repo;
            const artifactUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            // Read PNG files to get size info
            const tbPngPath = 'samples/sample-infrastructure-tb.png';
            const lrPngPath = 'samples/sample-infrastructure-lr.png';
            const tbPngSize = fs.statSync(tbPngPath).size;
            const lrPngSize = fs.statSync(lrPngPath).size;

            const formatSize = (bytes) => {
              const mb = bytes / (1024 * 1024);
              return mb < 1 ? `${(bytes / 1024).toFixed(1)} KB` : `${mb.toFixed(2)} MB`;
            };

            // Try to embed image as base64 if small enough (< 50KB)
            // GitHub might block data URIs for security, but let's test it
            const MAX_INLINE_SIZE = 50 * 1024; // 50KB
            let imagePreview = '';

            if (tbPngSize < MAX_INLINE_SIZE) {
              const tbPngData = fs.readFileSync(tbPngPath);
              const tbBase64 = tbPngData.toString('base64');
              imagePreview = [
                '',
                '### 🖼️ Preview (Top-to-Bottom Layout)',
                '',
                `<img src="data:image/png;base64,${tbBase64}" alt="Sample Infrastructure Diagram" width="600">`,
                '',
                '<sub>If the image above does not display, GitHub may be blocking inline images. Download from artifacts instead.</sub>',
                ''
              ].join('\n');
              core.info(`Embedded TB diagram as base64 (${formatSize(tbPngSize)})`);
            } else {
              core.info(`TB diagram too large for inline embedding (${formatSize(tbPngSize)} > 50KB)`);
            }

            const body = [
              '## 📊 Generated Sample Diagrams',
              '',
              'Sample infrastructure diagrams have been generated from `test/sample-graph.dot`.',
              imagePreview,
              '### 📦 Download All Formats',
              '',
              'All diagram formats are available as workflow artifacts:',
              '',
              `**[⬇️ Download sample-diagrams.zip](${artifactUrl}#artifacts)**`,
              '',
              'The artifact contains:',
              `- \`sample-infrastructure-tb.png\` (${formatSize(tbPngSize)}) - Top-to-Bottom layout`,
              `- \`sample-infrastructure-lr.png\` (${formatSize(lrPngSize)}) - Left-to-Right layout`,
              '- `sample-infrastructure-tb.svg` - Vector format (TB)',
              '- `sample-infrastructure-lr.svg` - Vector format (LR)',
              '- `sample-infrastructure-tb.pdf` - Print format (TB)',
              '- `sample-infrastructure-lr.pdf` - Print format (LR)',
              '',
              '---',
              '',
              `<sub>🤖 Generated at ${new Date().toISOString()} • [View workflow run](${artifactUrl})</sub>`
            ].join('\n');

            // Find existing comment by this bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
            });

            // Use login name for more reliable bot detection
            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('📊 Generated Sample Diagrams')
            );

            // Update existing comment or create new one
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: body
              });
              core.info(`Updated existing comment ${botComment.id}`);
            } else {
              const comment = await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: context.issue.number,
                body: body
              });
              core.info(`Created new comment ${comment.data.id}`);
            }
          } catch (error) {
            core.setFailed(`Failed to post PR comment: ${error.message}`);
            throw error;
          }

    - name: Commit and push diagrams
      # Only commit on main branches (develop, main) to avoid merge conflicts
      # On feature branches, diagrams are posted as PR comments instead
      if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add samples/
        if ! git diff --staged --quiet; then
          git commit -m "Update sample diagrams [skip ci]"

          # Pull latest changes and rebase our commit on top
          BRANCH_NAME="${{ github.ref_name }}"
          git pull --rebase origin "$BRANCH_NAME" || {
            echo "Rebase failed, trying merge strategy"
            git rebase --abort
            git pull --no-rebase origin "$BRANCH_NAME"
          }

          # Push with retry logic (up to 3 attempts)
          for i in 1 2 3; do
            if git push -u origin "$BRANCH_NAME"; then
              echo "Successfully pushed on attempt $i"
              break
            else
              if [ $i -lt 3 ]; then
                echo "Push failed, retrying in 2 seconds..."
                sleep 2
                git pull --rebase origin "$BRANCH_NAME" || git pull --no-rebase origin "$BRANCH_NAME"
              else
                echo "Failed to push after 3 attempts"
                exit 1
              fi
            fi
          done
        else
          echo "No changes to commit"
        fi

