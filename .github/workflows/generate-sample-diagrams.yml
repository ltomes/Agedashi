name: Generate Sample Diagrams

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install GraphViz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build agedashi
      run: cargo build --release

    - name: Create samples directory
      run: mkdir -p samples

    - name: Generate PNG diagram
      run: cat test/sample-graph.dot | ./target/release/agedashi --output png --name samples/sample-infrastructure

    - name: Generate SVG diagram
      run: cat test/sample-graph.dot | ./target/release/agedashi --output svg --name samples/sample-infrastructure

    - name: Generate PDF diagram
      run: cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name samples/sample-infrastructure

    - name: List generated files
      run: ls -lh samples/

    - name: Commit diagrams to repository
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add samples/
        git diff --staged --quiet || git commit -m "Update sample diagrams [skip ci]"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

