name: Generate Sample Diagrams

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install GraphViz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build agedashi
      run: cargo build --release

    - name: Create samples directory
      run: mkdir -p samples

    - name: Generate TB (top-to-bottom) diagrams
      run: |
        cat test/sample-graph.dot | ./target/release/agedashi --output png --name samples/sample-infrastructure-tb --direction TB
        cat test/sample-graph.dot | ./target/release/agedashi --output svg --name samples/sample-infrastructure-tb --direction TB
        cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name samples/sample-infrastructure-tb --direction TB

    - name: Generate LR (left-to-right) diagrams
      run: |
        cat test/sample-graph.dot | ./target/release/agedashi --output png --name samples/sample-infrastructure-lr --direction LR
        cat test/sample-graph.dot | ./target/release/agedashi --output svg --name samples/sample-infrastructure-lr --direction LR
        cat test/sample-graph.dot | ./target/release/agedashi --output pdf --name samples/sample-infrastructure-lr --direction LR

    - name: List generated files
      run: ls -lh samples/

    - name: Upload diagrams as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sample-diagrams
        path: samples/*.png
        retention-days: 90

    - name: Add diagrams to workflow summary
      run: |
        REPO="${{ github.repository }}"
        BRANCH="${{ github.ref_name }}"
        echo "## Generated Diagrams" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Top-to-Bottom Layout" >> $GITHUB_STEP_SUMMARY
        echo "![TB Diagram](https://raw.githubusercontent.com/${REPO}/${BRANCH}/samples/sample-infrastructure-tb.png)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Left-to-Right Layout" >> $GITHUB_STEP_SUMMARY
        echo "![LR Diagram](https://raw.githubusercontent.com/${REPO}/${BRANCH}/samples/sample-infrastructure-lr.png)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View all samples in repository →](https://github.com/${REPO}/tree/${BRANCH}/samples)" >> $GITHUB_STEP_SUMMARY

    - name: Post diagrams to PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          // Read the PNG files and convert to base64
          const tbDiagram = fs.readFileSync('samples/sample-infrastructure-tb.png');
          const lrDiagram = fs.readFileSync('samples/sample-infrastructure-lr.png');

          const tbBase64 = tbDiagram.toString('base64');
          const lrBase64 = lrDiagram.toString('base64');

          // Create comment body with embedded images
          const body = `## 📊 Generated Sample Diagrams

          <details open>
          <summary><b>Top-to-Bottom Layout</b></summary>

          ![Sample Infrastructure (TB)](data:image/png;base64,${tbBase64})

          </details>

          <details>
          <summary><b>Left-to-Right Layout</b></summary>

          ![Sample Infrastructure (LR)](data:image/png;base64,${lrBase64})

          </details>

          ---

          <sub>🤖 Generated from \`test/sample-graph.dot\` • [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>`;

          // Find existing comment by this bot
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('📊 Generated Sample Diagrams')
          );

          // Update existing comment or create new one
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Commit and push diagrams
      # Only commit on main branches (develop, main) to avoid merge conflicts
      # On feature branches, diagrams are posted as PR comments instead
      if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add samples/
        if ! git diff --staged --quiet; then
          git commit -m "Update sample diagrams [skip ci]"

          # Pull latest changes and rebase our commit on top
          BRANCH_NAME="${{ github.ref_name }}"
          git pull --rebase origin "$BRANCH_NAME" || {
            echo "Rebase failed, trying merge strategy"
            git rebase --abort
            git pull --no-rebase origin "$BRANCH_NAME"
          }

          # Push with retry logic (up to 3 attempts)
          for i in 1 2 3; do
            if git push -u origin "$BRANCH_NAME"; then
              echo "Successfully pushed on attempt $i"
              break
            else
              if [ $i -lt 3 ]; then
                echo "Push failed, retrying in 2 seconds..."
                sleep 2
                git pull --rebase origin "$BRANCH_NAME" || git pull --no-rebase origin "$BRANCH_NAME"
              else
                echo "Failed to push after 3 attempts"
                exit 1
              fi
            fi
          done
        else
          echo "No changes to commit"
        fi

