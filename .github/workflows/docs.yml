name: Documentation

on:
  push:
    branches:
      - "develop"
      - "main"
      - "claude/**"
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GraphViz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-cargo-

      - name: Build documentation
        run: |
          cargo doc --no-deps --document-private-items --all-features
          echo "<meta http-equiv=\"refresh\" content=\"0; url=agedashi\">" > target/doc/index.html

      - name: Build release binary
        run: cargo build --release

      - name: Create examples directory
        run: mkdir -p docs/examples

      - name: Generate example diagrams for all resource types
        run: |
          # Generate sample infrastructure diagrams
          if [ -f test/sample-graph.dot ]; then
            cat test/sample-graph.dot | ./target/release/agedashi --output png --name docs/examples/sample-infrastructure-tb --direction TB
            cat test/sample-graph.dot | ./target/release/agedashi --output svg --name docs/examples/sample-infrastructure-tb --direction TB
            cat test/sample-graph.dot | ./target/release/agedashi --output png --name docs/examples/sample-infrastructure-lr --direction LR
            cat test/sample-graph.dot | ./target/release/agedashi --output svg --name docs/examples/sample-infrastructure-lr --direction LR
          fi

          # Generate all AWS resources example if available
          if [ -f test/all-aws-resources.dot ]; then
            cat test/all-aws-resources.dot | ./target/release/agedashi --output png --name docs/examples/all-aws-resources --direction TB
            cat test/all-aws-resources.dot | ./target/release/agedashi --output svg --name docs/examples/all-aws-resources --direction TB
          fi

          # Generate complex modules example if available
          if [ -f test/complex-modules-test.dot ]; then
            cat test/complex-modules-test.dot | ./target/release/agedashi --output png --name docs/examples/complex-modules --direction LR
            cat test/complex-modules-test.dot | ./target/release/agedashi --output svg --name docs/examples/complex-modules --direction LR
          fi

      - name: Generate resource coverage report
        run: |
          mkdir -p docs/coverage
          cat > docs/coverage/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Agedashi - AWS Resource Coverage</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
                  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
                  h1 { color: #232F3E; }
                  .coverage-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
                  .stat-card { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; }
                  .stat-number { font-size: 48px; font-weight: bold; color: #FF9900; }
                  .stat-label { color: #666; margin-top: 10px; }
                  .examples { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin: 30px 0; }
                  .example { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
                  .example img { width: 100%; height: auto; }
                  .example-title { background: #232F3E; color: white; padding: 15px; font-weight: bold; }
                  .supported-resources { margin: 30px 0; }
                  .resource-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
                  .resource-item { background: #e8f5e9; padding: 10px; border-radius: 4px; font-size: 14px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🍲 Agedashi - AWS Resource Coverage</h1>
                  <p>This page documents the AWS resources supported by Agedashi and provides example diagrams.</p>

                  <div class="coverage-stats">
                      <div class="stat-card">
                          <div class="stat-number">25+</div>
                          <div class="stat-label">Supported AWS Resources</div>
                      </div>
                      <div class="stat-card">
                          <div class="stat-number">22</div>
                          <div class="stat-label">AWS Service Icons</div>
                      </div>
                      <div class="stat-card">
                          <div class="stat-number">4</div>
                          <div class="stat-label">Output Formats</div>
                      </div>
                  </div>

                  <h2>Example Diagrams</h2>
                  <div class="examples">
                      <div class="example">
                          <div class="example-title">Sample Infrastructure (Top-to-Bottom)</div>
                          <img src="sample-infrastructure-tb.png" alt="Sample TB">
                      </div>
                      <div class="example">
                          <div class="example-title">Sample Infrastructure (Left-to-Right)</div>
                          <img src="sample-infrastructure-lr.png" alt="Sample LR">
                      </div>
                  </div>

                  <h2>Supported AWS Resources</h2>
                  <div class="supported-resources">
                      <h3>Compute</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_instance (EC2)</div>
                          <div class="resource-item">aws_lambda_function</div>
                          <div class="resource-item">aws_ecs_*</div>
                          <div class="resource-item">aws_eks_*</div>
                          <div class="resource-item">aws_autoscaling_*</div>
                      </div>

                      <h3>Database</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_db_instance (RDS)</div>
                          <div class="resource-item">aws_dynamodb_table</div>
                          <div class="resource-item">aws_elasticache_*</div>
                          <div class="resource-item">aws_redshift_*</div>
                      </div>

                      <h3>Network</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_elb, aws_lb</div>
                          <div class="resource-item">aws_vpc</div>
                          <div class="resource-item">aws_subnet</div>
                          <div class="resource-item">aws_security_group</div>
                          <div class="resource-item">aws_route53_*</div>
                          <div class="resource-item">aws_cloudfront_*</div>
                          <div class="resource-item">aws_api_gateway_*</div>
                      </div>

                      <h3>Storage</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_s3_bucket</div>
                          <div class="resource-item">aws_ebs_*</div>
                      </div>

                      <h3>Security</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_iam_*</div>
                          <div class="resource-item">aws_kms_*</div>
                      </div>

                      <h3>Integration</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_sns_*</div>
                          <div class="resource-item">aws_sqs_*</div>
                      </div>

                      <h3>Analytics</h3>
                      <div class="resource-grid">
                          <div class="resource-item">aws_kinesis_*</div>
                      </div>
                  </div>

                  <h2>Documentation</h2>
                  <p><a href="../index.html">View Rust API Documentation →</a></p>
              </div>
          </body>
          </html>
          EOF

      - name: Copy examples to coverage directory
        run: |
          cp docs/examples/*.png docs/coverage/ 2>/dev/null || true
          cp docs/examples/*.svg docs/coverage/ 2>/dev/null || true

      - name: Create documentation index
        run: |
          mkdir -p docs
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Agedashi Documentation</title>
              <meta http-equiv="refresh" content="0; url=coverage/index.html">
          </head>
          <body>
              <p>Redirecting to documentation...</p>
          </body>
          </html>
          EOF

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            target/doc
            docs
          retention-days: 90

      - name: Prepare GitHub Pages content
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p gh-pages/api
          mkdir -p gh-pages/docs
          cp -r target/doc/* gh-pages/api/
          cp -r docs/* gh-pages/docs/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages

      - name: Comment on PR with documentation
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;

            const body = [
              '## 📚 Documentation Generated',
              '',
              'Documentation has been generated for this PR.',
              '',
              `**[⬇️ Download documentation artifact](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}#artifacts)**`,
              '',
              'The artifact contains:',
              '- Rust API documentation',
              '- AWS resource coverage report',
              '- Example diagrams in multiple formats',
              ''
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('📚 Documentation Generated')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
